services:
  postgres:
    image: postgres:16-alpine
    container_name: vogt-postgres
    environment:
      POSTGRES_DB: vogt_digital_campus
      POSTGRES_USER: vogt
      POSTGRES_PASSWORD: vogt
    ports:
      - "5432:5432"
    volumes:
      - vogt_pg_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: vogt-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: vogt-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

volumes:
  vogt_pg_data:
